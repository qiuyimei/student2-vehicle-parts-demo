name: Pure matching and dataset tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<10'
      - name: Check matching, labels, inputs and archive extraction
        run: python -m pytest -q tests/test_matching.py tests/test_parts.py tests/test_inputs.py tests/test_dataset_download.py
